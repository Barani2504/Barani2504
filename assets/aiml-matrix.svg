</g>
<g class="card" style="animation-delay: 0.35s;">
  <rect x="20" y="234" width="820" height="68" rx="8" fill="#131922" stroke="#30363d"/>
  <text x="36" y="260" fill="#e6edf3" font-size="14" font-weight="700">RAG Systems</text>
  <rect x="240" y="247" width="165" height="18" rx="9" fill="#f59e0b18" stroke="#f59e0b55"/>

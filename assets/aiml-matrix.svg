  <text x="36" y="132" fill="#7d8590" font-size="11">Core ML & TensorFlow Lite deployment for offline, private, real-time predictions on iOS</text>
</g>
<g class="card" style="animation-delay: 0.25s;">
  <rect x="20" y="158" width="820" height="68" rx="8" fill="#131922" stroke="#30363d"/>

<path d="M 838 44 L 828 44 M 838 44 L 838 54" stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.4"/>
<g class="card" style="animation-delay: 0.15s;">
  <rect x="20" y="82" width="820" height="68" rx="8" fill="#131922" stroke="#30363d"/>
  <text x="36" y="108" fill="#e6edf3" font-size="14" font-weight="700">On-Device Inference</text>
  <rect x="240" y="95" width="165" height="18" rx="9" fill="#38bdf818" stroke="#38bdf855"/>
  <text x="322" y="108" fill="#38bdf8" font-size="9.5" font-weight="600" text-anchor="middle">CORE ML · TFLITE</text>

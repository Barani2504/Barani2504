  <circle cx="26" cy="52" r="4" fill="#39d353" class="pulse"/>
  <text x="36" y="56" fill="#39d353" font-size="11" font-weight="700">NEURAL ENGINE: ACTIVE</text>
  <text x="210" y="56" fill="#7d8590" font-size="11">● RUNTIME: CORE ML &amp; TFLITE</text>
  <text x="440" y="56" fill="#7d8590" font-size="11">● ZERO CLOUD LATENCY (OFFLINE)</text>
  <text x="836" y="56" fill="#38bdf8" font-size="11" text-anchor="end">VISION &amp; RAG SUITE</text>
  <line x1="20" y1="68" x2="840" y2="68" stroke="#21262d" stroke-dasharray="3,3"/>
</g>

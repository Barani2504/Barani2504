  <text x="322" y="184" fill="#8b5cf6" font-size="9.5" font-weight="600" text-anchor="middle">YOLOV8 · RADIOLOGY CT</text>
  <text x="540" y="184" fill="#7d8590" font-size="12">Rating: <tspan fill="#8b5cf6" font-weight="700">●●●●○</tspan> (80%)</text>

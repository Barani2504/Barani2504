<svg xmlns="http://www.w3.org/2000/svg" width="860" height="8" viewBox="0 0 860 8">
  <defs>
    <linearGradient id="gGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6C2BD9" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="50%"  stop-color="#8B5CF6" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="100%" stop-color="#6C2BD9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none !important; } }
    .pulse { animation: gPulse 3s ease-in-out infinite; }
    @keyframes gPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1.0; } }
  </style>
  <rect width="860" height="4" y="2" rx="2" fill="url(#gGrad)" filter="url(#glow)" class="pulse"/>
</svg>

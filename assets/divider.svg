<svg xmlns="http://www.w3.org/2000/svg" width="860" height="6" viewBox="0 0 860 6">
  <defs>
    <linearGradient id="baseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="50%"  stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6C2BD9"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="70%"  stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) { .glow { animation: none !important; } }
    .glow { animation: travel 2.4s linear infinite; }
    @keyframes travel { 0% { transform: translateX(-860px); } 100% { transform: translateX(860px); } }
  </style>
  <rect width="860" height="2" y="2" rx="1" fill="url(#baseGrad)" opacity="0.65"/>
  <rect width="300" height="2" y="2" rx="1" fill="url(#glowGrad)" filter="url(#blur)" class="glow"/>
</svg>

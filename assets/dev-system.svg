  @keyframes blink { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .fade-in { opacity: 1 !important; transform: none !important; animation: none !important; }
    .pulse, .cursor { animation: none !important; }
  }
</style>

<svg xmlns="http://www.w3.org/2000/svg" width="860" height="46" viewBox="0 0 860 46">
  <defs>
    <linearGradient id="uGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <style>
    .cursor { animation: blink 1s step-start infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .uline { animation: slideIn 0.7s ease-out both; transform-origin: left center; }
    @keyframes slideIn { from{transform:scaleX(0)} to{transform:scaleX(1)} }
    @media (prefers-reduced-motion: reduce) { .cursor, .uline { animation: none !important; } }
  </style>
  <rect width="860" height="46" rx="8" fill="#0d1117"/>
  <rect width="860" height="46" rx="8" fill="none" stroke="#30363d" stroke-width="1"/>
  <circle cx="20" cy="20" r="5" fill="#ff5f56"/>
  <circle cx="36" cy="20" r="5" fill="#ffbd2e"/>
  <circle cx="52" cy="20" r="5" fill="#27c93f"/>
  <line x1="68" y1="8" x2="68" y2="38" stroke="#30363d" stroke-width="1"/>
  <text x="76" y="25" fill="#8B5CF6" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,monospace" font-size="12">~ $</text>
  <text x="106" y="25" fill="#e6edf3" font-family="'Fira Code','JetBrains Mono','SF Mono',Consolas,monospace" font-size="14" font-weight="600">&#x1F468;&#x200D;&#x1F4BB; About Me</text>
  <text x="319" y="25" fill="#38BDF8" font-family="'Fira Code',monospace" font-size="14" class="cursor">&#x25ae;</text>
  <rect x="106" y="39" width="205" height="2" rx="1" fill="url(#uGrad)" class="uline"/>
</svg>

  <line x1="454.0" y1="301" x2="824.0" y2="301" stroke="#d0d7de"/>
  <text x="454.0" y="319" fill="#57606a" font-size="10">Conversational health-monitoring chatbot with real-time vitals context &amp; offline cache</text>

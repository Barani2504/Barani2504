  <rect x="36.0" y="120" width="370.0" height="8" rx="4" fill="#e1e4e8"/>
  <rect x="36.0" y="120" width="296.0" height="8" rx="4" fill="#0284c7" class="bar-grow-80"/>
  <text x="36.0" y="144" fill="#0284c7" font-size="12" font-weight="700">●●●●○</text>
  <text x="406.0" y="144" fill="#57606a" font-size="11" text-anchor="end">80% Proficiency</text>

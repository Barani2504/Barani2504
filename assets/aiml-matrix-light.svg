  <text x="824.0" y="103" fill="#7c3aed" font-size="10" font-weight="700" text-anchor="end">YOLOV8 · RADIOLOGY CT</text>
  <rect x="454.0" y="120" width="370.0" height="8" rx="4" fill="#e1e4e8"/>
  <rect x="454.0" y="120" width="296.0" height="8" rx="4" fill="#7c3aed" class="bar-grow-80"/>
